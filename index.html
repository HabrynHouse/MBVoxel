<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mount & Blade Voxel — Character Comparison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Source Sans 3', sans-serif;
        background: #0a0a0f;
        color: #e8dcc8;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }

      #ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      #ui-overlay > * {
        pointer-events: auto;
      }

      .panel {
        background: linear-gradient(
          135deg,
          rgba(20, 16, 12, 0.92) 0%,
          rgba(35, 28, 20, 0.88) 100%
        );
        border: 1px solid rgba(180, 140, 80, 0.35);
        border-radius: 8px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 220, 160, 0.08);
      }

      #title-bar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 28px;
        text-align: center;
      }

      #title-bar h1 {
        font-family: 'Cinzel', serif;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: #d4af6a;
        text-transform: uppercase;
      }

      #title-bar p {
        font-size: 0.75rem;
        opacity: 0.65;
        margin-top: 2px;
      }

      #left-panel {
        position: absolute;
        top: 80px;
        left: 16px;
        width: 240px;
        padding: 16px;
      }

      #right-panel {
        position: absolute;
        top: 80px;
        right: 16px;
        width: 240px;
        padding: 16px;
      }

      #bottom-panel {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .panel-title {
        font-family: 'Cinzel', serif;
        font-size: 0.85rem;
        color: #c9a050;
        margin-bottom: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(180, 140, 80, 0.2);
        padding-bottom: 6px;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .btn-row {
        display: flex;
        gap: 6px;
      }

      button {
        font-family: 'Source Sans 3', sans-serif;
        font-size: 0.78rem;
        padding: 7px 12px;
        border: 1px solid rgba(180, 140, 80, 0.3);
        border-radius: 4px;
        background: rgba(40, 32, 24, 0.8);
        color: #e8dcc8;
        cursor: pointer;
        transition: all 0.15s ease;
        flex: 1;
      }

      button:hover {
        background: rgba(80, 60, 35, 0.6);
        border-color: rgba(200, 160, 90, 0.5);
      }

      button.active {
        background: rgba(120, 90, 45, 0.7);
        border-color: #c9a050;
        color: #fff;
      }

      button.equipped {
        background: rgba(60, 90, 50, 0.7);
        border-color: rgba(120, 180, 90, 0.5);
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        padding: 4px 0;
        opacity: 0.85;
      }

      .stat-label {
        opacity: 0.6;
      }

      #health-bar {
        width: 100%;
        height: 8px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 4px;
        margin-top: 8px;
        overflow: hidden;
      }

      #health-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #8b2020, #c04040);
        border-radius: 4px;
        transition: width 0.3s ease;
      }

      #controls-hint {
        position: absolute;
        bottom: 16px;
        right: 16px;
        padding: 10px 14px;
        font-size: 0.7rem;
        opacity: 0.7;
        line-height: 1.6;
        max-width: 220px;
      }

      kbd {
        display: inline-block;
        padding: 1px 5px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 3px;
        font-size: 0.65rem;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
      <div id="title-bar" class="panel">
        <h1>Medieval Adventurer</h1>
        <p>Voxel vs Polygon Character Comparison</p>
      </div>

      <div id="left-panel" class="panel">
        <div class="panel-title">Character Type</div>
        <div class="btn-group">
          <div class="btn-row">
            <button id="btn-voxel" class="active">Voxel</button>
            <button id="btn-polygon">Polygon</button>
          </div>
        </div>

        <div class="panel-title" style="margin-top: 16px">Armor</div>
        <div class="btn-group" id="armor-buttons">
          <button data-slot="helmet" id="armor-helmet">Helmet</button>
          <button data-slot="chest" id="armor-chest">Chest Plate</button>
          <button data-slot="pauldrons" id="armor-pauldrons">Pauldrons</button>
          <button data-slot="gauntlets" id="armor-gauntlets">Gauntlets</button>
          <button data-slot="greaves" id="armor-greaves">Greaves</button>
          <button data-slot="boots" id="armor-boots">Boots</button>
        </div>
      </div>

      <div id="right-panel" class="panel">
        <div class="panel-title">Weapons</div>
        <div class="btn-group" id="weapon-buttons">
          <button data-weapon="sword" id="weapon-sword" class="equipped">Sword</button>
          <button data-weapon="axe" id="weapon-axe">Battle Axe</button>
          <button data-weapon="mace" id="weapon-mace">Mace</button>
          <button data-weapon="bow" id="weapon-bow">Longbow</button>
          <button data-weapon="shield" id="weapon-shield">Shield</button>
          <button data-weapon="none" id="weapon-none">Unequip</button>
        </div>

        <div class="panel-title" style="margin-top: 16px">Status</div>
        <div class="stat-row">
          <span class="stat-label">Health</span>
          <span id="health-text">100 / 100</span>
        </div>
        <div id="health-bar"><div id="health-fill"></div></div>
        <div class="stat-row" style="margin-top: 8px">
          <span class="stat-label">Enemies Slain</span>
          <span id="kill-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Active Enemies</span>
          <span id="enemy-count">0</span>
        </div>
      </div>

      <div id="bottom-panel" class="panel">
        <button id="btn-spawn">Spawn Enemy</button>
        <button id="btn-heal">Rest (+30 HP)</button>
      </div>

      <div id="controls-hint" class="panel">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br />
        <kbd>Shift</kbd> Run &nbsp; <kbd>Space</kbd> Attack<br />
        <kbd>Mouse</kbd> Orbit camera<br />
        Click armor/weapons to toggle
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
